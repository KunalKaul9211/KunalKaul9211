# Google Cloud Run deployment for MonkMedia NRCS
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: monkmedia-nrcs
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/execution-environment: gen2
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/minScale: "1"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
    spec:
      containerConcurrency: 100
      timeoutSeconds: 300
      containers:
        - image: gcr.io/PROJECT_ID/monkmedia-nrcs:latest
          ports:
            - containerPort: 5000
              name: http1
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              value: mongodb://MONGO_HOST:27017/monkmedia_nrcs
            - name: REDIS_URL
              value: redis://REDIS_HOST:6379
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: monkmedia-secrets
                  key: jwt-secret
            - name: CLIENT_URL
              value: https://monkmedia-nrcs-PROJECT_ID.a.run.app
            - name: SOCKET_URL
              value: https://monkmedia-nrcs-PROJECT_ID.a.run.app
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
            requests:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  traffic:
    - percent: 100
      latestRevision: true